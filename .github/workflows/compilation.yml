name: Compilation Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Déclaré ici car l'organisation impose la lecture seule par défaut.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restauration de la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 manquant" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > "$RUNNER_TEMP/rio-poneglyph.jks"

      - name: Compilation de l'APK signé
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/rio-poneglyph.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nommage de l'APK
        id: apk
        run: |
          VERSION=$(grep -oP 'val versionNom = "\K[^"]+' app/build.gradle.kts)
          NOM="Rio-Poneglyph-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"

      - name: Archivage de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nom }}
          path: ${{ steps.apk.outputs.nom }}

      - name: Publication de la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.nom }}
          name: Rio Poneglyph ${{ github.ref_name }}
          body_path: NOUVEAUTES.md

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/rio-poneglyph.jks"
